<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - iTired</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #050505;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .error-container {
            text-align: center;
            padding: 40px;
            max-width: 500px;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        
        .error-message {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .error-desc {
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 32px;
            font-size: 1rem;
        }
        
        .btn {
            display: inline-block;
            padding: 14px 28px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }
        
        .footer {
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .footer a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            margin: 0 12px;
            font-size: 0.875rem;
            transition: color 0.2s;
        }
        
        .footer a:hover {
            color: #6366f1;
        }
        
        .footer-logo {
            font-weight: 800;
            font-size: 1.25rem;
            color: #6366f1;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">{{ code }}</div>
        <h1 class="error-message">{{ message }}</h1>
        <p class="error-desc">{{ desc }}</p>
        
        <a href="/" class="btn">
            <i class="fas fa-home"></i> На главную
        </a>
        
        <div class="footer">
            <div class="footer-logo">
                <i class="fas fa-headphones"></i> iTired
            </div>
            <div>
                <a href="https://github.com/itiredmp3" target="_blank">
                    <i class="fab fa-github"></i> GitHub
                </a>
                <a href="https://soundcloud.com/itired" target="_blank">
                    <i class="fab fa-soundcloud"></i> SoundCloud
                </a>
            </div>
        </div>
    </div>
</body>
</html>
